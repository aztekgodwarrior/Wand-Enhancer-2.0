name: Build Windows EXE (MSBuild)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Find solution, restore, and build
        shell: pwsh
        run: |
          $sln = Get-ChildItem -Filter *.sln -Recurse | Select-Object -First 1
          if (-not $sln) { throw "No .sln file found in repository." }
          Write-Host "Building: $($sln.FullName)"
          nuget restore $sln.FullName
          msbuild $sln.FullName /p:Configuration=Release /p:OutputPath=C:\build_output

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Release
          path: C:\build_output\
